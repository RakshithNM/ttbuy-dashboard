    <!--
      The stylesheet below is a normal render-blocking <link> (see
      vite.config.ts — it used to load async via a preload+onload swap, but
      that let the full layout, not just paint, reflow once CSS arrived,
      which measured as a large layout shift on slow connections; render-
      blocking a single ~11KB gzipped file back-of-envelopes to well under a
      second even on Slow 3G, which is worth it to avoid that). Browsers
      won't paint until the stylesheet is applied, so this inline block
      shouldn't normally be visible at all — it's a fallback for the case
      where the stylesheet request itself errors out, so a failed CSS load
      still shows the right background/font/margin instead of stark UA
      defaults. Values must be kept in sync with body/:root in style.scss
      and _theme.scss.
    -->
    <script>
      // Sets html[data-theme] before paint so the light-dark() colors below
      // (and the ones in _theme.scss once it loads) pick the right side
      // immediately instead of flashing light then switching. Mirrors the
      // stored-theme logic in App.vue's THEME_STORAGE_KEY.
      try {
        var t = localStorage.getItem("ttbuy-dashboard:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      html { color-scheme: light dark; }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      html, body { margin: 0; padding: 0; }
      body {
        background: light-dark(#f9f9f7, #0d1014);
        color: light-dark(#0b0b0b, #ffffff);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "My bank isn't the best rate today. What should I do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Check the historical chart to see if it's consistently low. A one-day dip is normal; a persistent gap of ₹500+ per $1,000 over weeks is worth acting on. For large one-off transfers, call your bank's forex desk before the sender initiates the transfer. Many banks will offer a better rate on request. For regular transfers, switching to a consistently higher-rated bank is the more reliable fix."
          }
        },
        {
          "@type": "Question",
          "name": "What is TT Buy rate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TT Buy (Telegraphic Transfer Buy) is the rate your bank applies when foreign currency arrives in your account as a wire transfer. It applies whether you receive a salary from a foreign employer, client payments for freelance work, or a family remittance. Banks set this rate independently and update it daily, which is why the same $1,000 can net you ₹500 more at one bank than another."
          }
        },
        {
          "@type": "Question",
          "name": "Can I negotiate a better rate with my bank?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, for larger transfers. Most banks will consider a rate improvement for transfers equivalent to roughly ₹5 lakh or more if you call the forex desk before the transfer is sent. The published rate here is the standard retail rate. Negotiated rates are not published. It helps to mention you've seen competing rates and are considering your options."
          }
        },
        {
          "@type": "Question",
          "name": "I've decided to switch — how do I actually do it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You don't need to close your existing account — just open a new one at the bank with the better rate. For inward remittances, it helps to open at a branch authorized to handle foreign exchange (an Authorized Dealer, or \"AD\", branch) — for example, if you're going with IOB, ask for an AD branch that handles forex/NRI transactions. Once it's open, give that account's IFSC and SWIFT code to whoever sends you money — your employer, client, or family — for future transfers. Money already sent to your old account doesn't need to change."
          }
        },
        {
          "@type": "Question",
          "name": "How is this data collected?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An automated scraper fetches each bank's publicly published forex rate page every day at 11 AM IST. The rates are the same ones any customer would see on the bank's website. Banks typically publish by 10 AM IST. This site is not affiliated with any bank and does not have access to live or negotiated rates."
          }
        }
      ]
    }
