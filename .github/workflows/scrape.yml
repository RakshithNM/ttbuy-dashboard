name: Scrape TT Buy rates

on:
  schedule:
    - cron: "30 5 * * *"  # 11:00 IST daily
    - cron: "30 10 * * *" # 16:00 IST daily — retry for banks the morning run missed
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BANKS: axis,iob,bob,canara,icici,sbi,hdfc,kotak,idbi,bandhan,cityunion,hsbc,jkbank,kvb,citibank,ujjivan,dcb,idfcfirst,dbs,pnb,rbl,unionbank,skydo,remitly
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser (Kotak, DCB, IDFC FIRST, DBS need a headless render)
        run: playwright install --with-deps chromium

      - name: Scrape live rates
        env:
          MAX_SNAPSHOTS: "0"
          INCLUDE_LIVE: "1"
        run: python3 -m scraper.main

      - name: Scrape benchmark rates
        run: python3 -m scraper.benchmarks

      - name: Export rates.json
        run: python3 -m scraper.export_json

      - name: Sync data into site
        run: |
          cp data/rates.json site/public/data/rates.json
          cp data/benchmarks.json site/public/data/benchmarks.json || true

      - name: Commit updated data
        run: |
          git config user.name "ttbuy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/public/data/rates.json site/public/data/benchmarks.json
          git diff --cached --quiet || git commit -m "Update TT Buy rates $(date -u +%F)"
          git push

      # Last on purpose: fresh data is already committed and deployed. A
      # failure here only marks the run red so GitHub notifies the owner.
      - name: Fail if any bank's rate is stale
        run: python3 -m scraper.check_stale
