name: Build site

# Catch type errors and build failures here, before Cloudflare's deploy does.
# The data commits from scrape.yml do not trigger this: pushes made with
# GITHUB_TOKEN never start other workflows.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/build-site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # npm install, not npm ci: package-lock.json is gitignored, so this
      # resolves dependencies the same way the Cloudflare build does.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build
