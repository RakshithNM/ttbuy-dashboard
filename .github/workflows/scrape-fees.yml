name: Scrape inward remittance fees

on:
  schedule:
    - cron: "0 6 1 * *" # 11:30 IST on the 1st of every month — fee schedules barely ever change
  workflow_dispatch: {}

jobs:
  scrape-fees:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser (DBS needs a headless render)
        run: playwright install --with-deps chromium

      - name: Scrape fee schedules
        run: python3 -m scraper.fees_main

      - name: Sync fees.json into site
        run: cp data/fees.json site/public/data/fees.json

      - name: Commit updated fee data
        run: |
          git config user.name "ttbuy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fees.json site/public/data/fees.json
          git diff --cached --quiet || git commit -m "Update inward remittance fee schedules $(date -u +%F)"
          git push
