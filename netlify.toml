[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # VAPID public key is intentionally public — suppress secrets scanner false positive
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY"

[functions]
  node_bundler = "nft"

# Hashed assets (JS/CSS bundles) — cache forever, Vite fingerprints filenames
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and fonts — cache for 1 year
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker — must revalidate every time
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# HTML pages and JSON data — revalidate daily
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/send-alerts"
  to = "/.netlify/functions/send-alerts"
  status = 200

[[redirects]]
  from = "/api/email-subscribe"
  to = "/.netlify/functions/email-subscribe"
  status = 200

[[redirects]]
  from = "/api/email-unsubscribe"
  to = "/.netlify/functions/email-unsubscribe"
  status = 200

[[redirects]]
  from = "/api/weekly-digest"
  to = "/.netlify/functions/weekly-digest"
  status = 200
