[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # VAPID public key is intentionally public — suppress secrets scanner false positive
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY"

[functions]
  node_bundler = "nft"

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/send-alerts"
  to = "/.netlify/functions/send-alerts"
  status = 200

[[redirects]]
  from = "/api/email-subscribe"
  to = "/.netlify/functions/email-subscribe"
  status = 200

[[redirects]]
  from = "/api/email-unsubscribe"
  to = "/.netlify/functions/email-unsubscribe"
  status = 200

[[redirects]]
  from = "/api/weekly-digest"
  to = "/.netlify/functions/weekly-digest"
  status = 200

[functions."weekly-digest"]
  schedule = "30 3 * * 5"
